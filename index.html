<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Jogo da Vida</title>
    <link rel="stylesheet" href="css/style.css?v=4.1">
</head>
<body>

    <div class="game-container">
        <!-- ECRÃ INICIAL -->
        <div id="setup-screen" class="setup-screen">
            <div class="logo-wrapper">
                <h1 class="logo-title">Jogo da Vida</h1>
                <p class="logo-subtitle">PORTUGAL</p>
            </div>
            
            <div class="bitlife-menu">
                <div class="bitlife-card">
                    <input type="text" id="player-name" value="Marco Silva">
                    <div class="bitlife-subtitle">Nome</div>
                </div>

                <div class="bitlife-card" onclick="alternarGenero()">
                    <div class="bitlife-value" id="btn-genero">♂️ Masculino</div>
                    <div class="bitlife-subtitle">Gênero</div>
                </div>

                <div class="bitlife-card" onclick="alternarCidade()">
                    <div class="bitlife-value" id="btn-cidade">🇵🇹 Porto</div>
                    <div class="bitlife-subtitle">Cidade</div>
                </div>
            </div>

            <button class="btn-start" onclick="iniciarJogo()">✨ Iniciar Nova Vida</button>
        </div>

        <!-- ECRÃ DE JOGO COM SALÃO DE BELEZA/CUSTOMIZAÇÃO -->
        <div id="game-screen" class="hidden main-game-layout">
            <div class="header">
                <div class="avatar-wrapper">
                    <div id="ui-avatar-cabelo" class="camada-avatar">🧔</div>
                    <div id="ui-avatar-olhos" class="camada-avatar-olhos">😐</div>
                </div>
                <div class="info">
                    <h2 id="ui-nome">Alexandre</h2>
                    <p id="ui-detalhes">Masculino | Porto</p>
                </div>
            </div>

            <!-- MENU PASSO A PASSO DE CUSTOMIZAÇÃO DO BONECO -->
            <div id="customizer-box" class="customizer-panel">
                <h3>💇‍♂️ Personalizar Boneco</h3>
                <div class="custom-buttons-grid">
                    <button class="btn-custom" onclick="alternarTipoCabelo()">💇 Estilo</button>
                    <button class="btn-custom" onclick="alternarCorCabelo()">🎨 Cor</button>
                    <button class="btn-custom" onclick="alternarPele()">🫱🏻 Pele</button>
                    <button class="btn-custom" onclick="alternarOlhos()">👁️ Olhos</button>
                </div>
            </div>

            <div class="stats-grid">
                <div class="stat-card"><div class="stat-label">⏳ Idade</div><div id="ui-idade" class="stat-val">0 anos</div></div>
                <div class="stat-card"><div class="stat-label">💼 Carreira</div><div id="ui-emprego" class="stat-val">Bebé</div></div>
                <div class="stat-card"><div class="stat-label">💰 Banco</div><div id="ui-dinheiro" class="stat-val">1000€</div></div>
                <div class="stat-card"><div class="stat-label">🤝 Cunha</div><div id="ui-cunha" class="stat-val">30%</div></div>
                <div class="stat-card accent"><div class="stat-label">❤️ Saúde</div><div id="ui-saude" class="stat-val">100%</div></div>
                <div class="stat-card accent"><div class="stat-label">😄 Felicidade</div><div id="ui-felicidade" class="stat-val">100%</div></div>
                <div class="stat-card oculto"><div class="stat-label">🔥 Loucura</div><div id="ui-loucura" class="stat-val">0%</div></div>
                <div class="stat-card oculto"><div class="stat-label">☯️ Karma</div><div id="ui-karma" class="stat-val">100%</div></div>
            </div>

            <div id="log" class="log-box">Bem-vindo a Portugal!</div>
            <div id="ui-assets" class="assets-view hidden">Garagem/Imóveis vazios.</div>

            <div class="actions-layout" id="action-buttons">
                <button onclick="envelhecer()">⏳ Avançar 1 Ano</button>
                <button class="btn-sec" id="btn-estudar" onclick="atividadesEstudante()" style="display:none">🎒 Atividades Escolares</button>
                <button class="btn-sec" onclick="procurarEmprego()">💼 Procurar Trabalho</button>
                <button class="btn-sec" onclick="abrirStand()">🚗 Stand & Imobiliária</button>
                <button class="btn-sec" onclick="fazerNetworking()">🥂 Jantar de Cunha (-150€)</button>
                <button class="btn-sec" onclick="tentarCrime()">🕶️ Tentar um Esquema</button>
                <button class="btn-danger" onclick="reiniciar()">🔄 Recomeçar</button>
            </div>
        </div>
    </div>

    <script src="js/game.js?v=4.1"></script>
</body>
</html>
